name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # nightly: full soak
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: probe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: probe/go.mod
          cache-dependency-path: probe/go.sum
      - name: vet (production, fixture and soak build tags)
        run: make vet
      - name: tests with the race detector
        run: CGO_ENABLED=1 go test -race -count=1 ./...
      - name: fuzz targets (30 s each)
        run: make fuzz
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          working-directory: probe
          version: v2.15.0
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  image:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: build and run the image under the compose file
        run: |
          make -C probe image
          make -C probe smoke
      - name: reproducible build check
        run: |
          make -C probe image IMAGE=ondrya-probe:a
          make -C probe image IMAGE=ondrya-probe:b
          a=$(docker create ondrya-probe:a); b=$(docker create ondrya-probe:b)
          docker cp "$a:/probe" /tmp/probe-a; docker cp "$b:/probe" /tmp/probe-b
          cmp /tmp/probe-a /tmp/probe-b

  soak:
    # github.workflow is the caller's name when reused by release.yml
    if: github.workflow == 'ci' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    needs: image
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: probe/go.mod
          cache-dependency-path: probe/go.sum
      - name: failure and soak tests, 30 minute churn
        run: make -C probe soak-full
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: soak-report
          path: probe/test/soak/report.jsonl
